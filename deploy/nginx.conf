server {
    listen 80;
    listen [::]:80;
    server_name blog.wanglvyuan.com;
    root /var/www/6yuan/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location / { try_files $uri $uri/ =404; }
    location ~* \.(?:css|js)$ { expires 1h; }
    location ~* \.(?:woff2|png|jpg|jpeg|webp|gif|avif|svg|ico)$ { expires 30d; }
    location /media/ { expires 1y; }
    location /downloads/ { expires 1d; }
    location ~ /\. { deny all; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
